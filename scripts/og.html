<!doctype html>
<!--
  OG attēla (public/og.png) dizaina avots.
  Ja gribi atjaunot OG attēlu: atver šo failu pārlūkā logā 1200x630
  un uzņem ekrānuzņēmumu, vai palaid scripts/generate-assets.mjs
  (vajag Node + playwright-core + Chromium).
-->
<html lang="lv">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: #0a2540;
    font-family: "Inter", system-ui, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
  }
  .blob.a { width: 560px; height: 560px; right: -160px; top: -220px; background: rgba(37, 99, 235, 0.55); }
  .blob.b { width: 480px; height: 480px; left: -180px; bottom: -240px; background: rgba(56, 189, 248, 0.35); }
  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 80%);
  }
  .content { position: relative; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 24px;
    font-weight: 500;
    color: #bcd3f5;
  }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; }
  h1 {
    margin-top: 36px;
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-size: 96px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  h1 .accent {
    background: linear-gradient(92deg, #60a5fa, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub {
    margin-top: 24px;
    font-size: 34px;
    color: #9db8dc;
    max-width: 900px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="blob a"></div>
  <div class="blob b"></div>
  <div class="grid-bg"></div>
  <div class="content">
    <span class="chip"><span class="dot"></span>rba.lv</span>
    <h1>Roberts <span class="accent">Būda</span></h1>
    <p class="sub">AI-native izstrādātājs un automatizācijas speciālists. AI aģenti, procesu automatizācijas un pilni produkti.</p>
  </div>
</body>
</html>
